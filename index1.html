<style>

 g=q.createRadialGradient(120,120,60,120,120,R);g.addColorStop(0,'rgba(60,50,40,0)');g.addColorStop(1,'rgba(60,50,40,.45)');q.fillStyle=g;q.fillRect(0,0,240,240);return m}

];
const PHOTO_COUNT = 16;   // how many round photos float with the words
// ==========================

document.getElementById("psmall").textContent = SMALL_TEXT;
document.getElementById("pscript").textContent = SCRIPT_TEXT;

const cv = document.getElementById("pc");
const ctx = cv.getContext("2d", { alpha: false });
const LIGHTS = [55, 65, 75];
const BASE = 32;
let W = innerWidth, H = innerHeight, S = 10, cx = W / 2, cy = H / 2, dpr = Math.min(window.devicePixelRatio || 1, 2), n = MAX_COUNT;
let sprites = [];
let photoImgs = [], photoSprites = [];
let running = false, raf = 0;

PHOTOS.forEach((src, i) => {
  const img = new Image();
  img.onload = () => { photoImgs[i] = img; buildPhoto(i); };
  img.src = src;
});
function buildPhoto(i) {
  const img = photoImgs[i];
  if (!img || !img.naturalWidth) return;
  const s = Math.round(96 * dpr);
  const c = document.createElement("canvas");
  c.width = c.height = s;
  const g = c.getContext("2d");
  const iw = img.naturalWidth, ih = img.naturalHeight;
  const m = Math.min(iw, ih);
  const sx = (iw - m) / 2, sy = (ih - m) * 0.3;
  g.save();
  g.beginPath(); g.arc(s / 2, s / 2, s / 2 - 3 * dpr, 0, Math.PI * 2); g.clip();
  g.drawImage(img, sx, sy, m, m, 0, 0, s, s);
  g.restore();
  g.lineWidth = 3 * dpr; g.strokeStyle = "#ff2d55";
  g.beginPath(); g.arc(s / 2, s / 2, s / 2 - 3 * dpr, 0, Math.PI * 2); g.stroke();
  photoSprites[i] = c;
}
function buildAllPhotos() { photoImgs.forEach((_, i) => buildPhoto(i)); }
const mouse = { x: -9999, y: -9999 };
let gather = false, lastSwitch = 0;

function heartPoint(t) {
  return {
    x: 16 * Math.sin(t) ** 3,
    y: -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t))
  };
}

function buildSprites() {
  sprites = WORDS.map(word => LIGHTS.map(l => {
    const f = BASE * dpr;
    const c = document.createElement("canvas");
    const g = c.getContext("2d");
    g.font = f + "px system-ui, sans-serif";
    c.width = Math.ceil(g.measureText(word).width) + 4;
    c.height = Math.ceil(f * 1.35);
    g.font = f + "px system-ui, sans-serif";
    g.fillStyle = `hsl(350, 100%, ${l}%)`;
    g.fillText(word, 2, f);
    return c;
  }));
}

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  S = Math.min(W / 40, (H * 0.6) / 30);
  cx = W / 2;
  cy = H * 0.40 - 2.5 * S;
  n = Math.max(120, Math.min(MAX_COUNT, Math.round(W * H / 2500)));
  buildSprites();
}

const P = [];
for (let i = 0; i < MAX_COUNT; i++) {
  const hp = heartPoint(Math.random() * Math.PI * 2);
  const k = 0.55 + 0.45 * Math.random();
  P.push({
    wi: Math.floor(Math.random() * WORDS.length),
    li: Math.floor(Math.random() * LIGHTS.length),
    size: 10 + Math.random() * 12,
    x: Math.random() * innerWidth,
    y: Math.random() * innerHeight,
    vx: 0, vy: 0, z: 0,
    tx: hp.x * k, ty: hp.y * k,
    tz: (Math.random() - 0.5) * 10,
    alpha: 0.5 + Math.random() * 0.5
  });
}
if (PHOTOS.length) {
  for (let j = 0; j < Math.min(PHOTO_COUNT, 80); j++) {
    const q = P[Math.floor(j * 80 / PHOTO_COUNT)];
    q.photo = true;
    q.pi = j % PHOTOS.length;
  }
}

addEventListener("resize", () => { if (running) { resize(); buildAllPhotos(); } });
addEventListener("orientationchange", () => setTimeout(() => { if (running) { resize(); buildAllPhotos(); } }, 200));

let down = null;
cv.addEventListener("pointerdown", e => {
  mouse.x = e.clientX; mouse.y = e.clientY;
  down = { x: e.clientX, y: e.clientY, t: performance.now() };
});
cv.addEventListener("pointermove", e => { mouse.x = e.clientX; mouse.y = e.clientY; });
cv.addEventListener("pointerup", e => {
  if (down && Math.hypot(e.clientX - down.x, e.clientY - down.y) < 12
      && performance.now() - down.t < 350) {
    gather = !gather;
    lastSwitch = performance.now();
  }
  down = null;
  if (e.pointerType !== "mouse") mouse.x = mouse.y = -9999;
});
cv.addEventListener("pointercancel", () => { down = null; mouse.x = mouse.y = -9999; });
cv.addEventListener("pointerleave", () => { mouse.x = mouse.y = -9999; });
cv.addEventListener("contextmenu", e => e.preventDefault());

let last = 0, accMs = 0, frames = 0;

function frame(t) {
  if (!running) return;
  const dt = Math.min(50, last ? t - last : 16.7);
  last = t;
  const k = dt / 16.667;

  accMs += dt; frames++;
  if (frames === 60) {
    if (accMs / 60 > 26 && n > 80) n = Math.max(80, Math.floor(n * 0.85));
    accMs = 0; frames = 0;
  }

  ctx.globalAlpha = 1 - Math.pow(0.72, k);
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, W, H);

  if (t - lastSwitch > SWITCH_MS) { gather = !gather; lastSwitch = t; }
  const beat = 1 + 0.025 * Math.sin(t / 180);
  const R = W < 600 ? 90 : 110;
  const angle = t * SPIN_SPEED;
  const cosA = Math.cos(angle), sinA = Math.sin(angle);
  const dGather = Math.pow(0.85, k), dFree = Math.pow(0.98, k);

  for (let i = 0; i < n; i++) {
    const p = P[i];

    if (gather) {
      const rx = p.tx * cosA + p.tz * sinA;
      p.z = -p.tx * sinA + p.tz * cosA;
      p.vx += (cx + rx * S * beat - p.x) * 0.02 * k;
      p.vy += (cy + p.ty * S * beat - p.y) * 0.02 * k;
      p.vx *= dGather; p.vy *= dGather;
    } else {
      p.z = 0;
      p.vx += ((Math.random() - 0.5) * 0.15 - (p.y - cy) * 0.00012) * k;
      p.vy += ((Math.random() - 0.5) * 0.15 - 0.01 + (p.x - cx) * 0.00012) * k;
      p.vx *= dFree; p.vy *= dFree;
    }

    const dx = p.x - mouse.x, dy = p.y - mouse.y;
    const d2 = dx * dx + dy * dy;
    if (d2 < R * R && d2 > 0) {
      const d = Math.sqrt(d2), f = (R - d) / R * 3 * k;
      p.vx += dx / d * f;
      p.vy += dy / d * f;
    }

    p.x += p.vx * k; p.y += p.vy * k;

    if (!gather) {
      if (p.x < -50) p.x = W + 50; else if (p.x > W + 50) p.x = -50;
      if (p.y < -20) p.y = H + 20; else if (p.y > H + 20) p.y = -20;
    }

    const depth = 1 + p.z * 0.03;
    const ps = p.photo ? photoSprites[p.pi] : null;
    if (ps) {
      const dm = p.size * 2.4 * depth;
      ctx.globalAlpha = Math.min(1, (0.75 + 0.25 * p.alpha) * depth);
      ctx.drawImage(ps, p.x - dm / 2, p.y - dm / 2, dm, dm);
    } else {
      const r = p.size * depth / BASE;
      const sp = sprites[p.wi][p.li];
      ctx.globalAlpha = Math.min(1, p.alpha * depth);
      ctx.drawImage(sp, p.x, p.y - BASE * r, sp.width / dpr * r, sp.height / dpr * r);
    }
  }
  ctx.globalAlpha = 1;
  raf = requestAnimationFrame(frame);
}

return {
  start() {
    if (running) return;
    running = true;
    resize(); buildAllPhotos();
    mouse.x = mouse.y = -9999; down = null;
    gather = false; last = 0; accMs = 0; frames = 0;
    lastSwitch = performance.now();
    ctx.globalAlpha = 1; ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
    raf = requestAnimationFrame(frame);
  },
  stop() { running = false; cancelAnimationFrame(raf); }
};
})();
</script>
